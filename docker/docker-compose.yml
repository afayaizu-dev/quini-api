services:
  postgres:
    image: postgres:18-alpine
    container_name: quini-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: quini
      POSTGRES_PASSWORD: quini
      POSTGRES_DB: quini
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - quini-pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quini -d quini"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  quini-pgdata:
