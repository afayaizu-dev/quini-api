        description: Gestión de equipos.
      - name: jornadas
        description: Jornadas y partidos de una temporada (F11).
    paths:
      /auth/token:
        post:
          operationId: authToken
          summary: Obtiene tokens (password grant o refresh_token grant)
          description: Compatible en forma con el password grant de OAuth2 (RFC 6749).
            También acepta grant_type=refresh_token para rotar el refresh token,
            con detección de reuso. Ver docs/02-Autenticacion.md.
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/x-www-form-urlencoded:
                schema:
                  oneOf:
                    - type: object
                      properties:
                        grant_type:
                          type: string
                          const: password
                        username:
                          type: string
                          minLength: 1
                        password:
                          type: string
                          minLength: 1
                      required:
                        - grant_type
                        - username
                        - password
                    - type: object
                      properties:
                        grant_type:
                          type: string
                          const: refresh_token
                        refresh_token:
                          type: string
                          minLength: 1
                      required:
                        - grant_type
                        - refresh_token
                  type: object
                examples:
                  password:
                    summary: Login con contraseña
                    value:
                      grant_type: password
                      username: admin@quini.local
                      password: TuPass123456
                  refresh:
                    summary: Renovar con refresh_token
                    value:
                      grant_type: refresh_token
                      refresh_token: kUyRts-...
          responses:
            "200":
              description: Tokens emitidos correctamente.
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "400":
              description: Body mal formado o campos faltantes.
            "401":
              description: Credenciales incorrectas o refresh token inválido/reutilizado.
            "429":
              description: Demasiados intentos fallidos (rate limit).
      /auth/revoke:
        post:
          operationId: authRevoke
          summary: Revoca un refresh token concreto
          description: Cierra sesión en un solo dispositivo/sesión. Si el token ya no
            existe o ya estaba revocado, no falla (operación idempotente).
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/json:
                example:
                  refresh_token: kUyRts-...
                schema:
                  type: object
                  properties:
                    refresh_token:
                      type: string
                      minLength: 1
                  required:
                    - refresh_token
          responses:
            "204":
              description: Revocado (o ya lo estaba).
            "401":
              description: Sin access token válido.
      /auth/logout:
        post:
          operationId: authLogout
          summary: Revoca todos los refresh tokens del usuario autenticado
          description: Cierra sesión en todos los dispositivos.
          tags:
            - auth
          responses:
            "204":
              description: Todas las sesiones cerradas.
            "401":
              description: Sin access token válido.
      /auth/me:
        get:
          operationId: authMe
          summary: Devuelve la identidad del usuario autenticado
          description: Lee el payload del access token ya verificado por requireAuth — no
            consulta la base de datos.
          tags:
            - auth
          responses:
            "200":
              description: Payload del access token.
              content:
                application/json:
                  example:
                    userId: 019fe824-d230-782b-9157-e345641ed2f9
                    email: admin@quini.local
                    role: admin
                  schema:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      role:
                        type: string
                        enum:
                          - user
                          - admin
                    required:
                      - userId
                      - email
                      - role
                    additionalProperties: false
            "401":
              description: Sin access token válido.
      /auth/register:
        post:
          operationId: authRegister
          summary: Completa el registro a partir de una invitación
          description: Consume una invitación de un solo uso (por token) y crea el usuario
            con el rol de la invitación, en una transacción. Ver
            docs/02-Autenticacion.md.
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/json:
                example:
                  token: 5rJnTHUDGC2bHp0KgNbp5Z0aeIlJWTTKWZ9wQcGlImQ
                  password: OtraPass123456
                  nombre: Pepe
                schema:
                  type: object
                  properties:
                    token:
                      type: string
                      minLength: 1
                    password:
                      type: string
                      minLength: 12
                    nombre:
                      type: string
                      minLength: 1
                  required:
                    - token
                    - password
                    - nombre
          responses:
            "201":
              description: Usuario creado y tokens emitidos.
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "404":
              description: El token de invitación no existe.
            "410":
              description: La invitación ya fue usada, revocada o caducó.
            "429":
              description: Demasiados intentos fallidos (rate limit).
      /auth/google:
        get:
          operationId: authGoogleAuthorize
          summary: Inicia el login con Google (Authorization Code + PKCE)
          description: Redirige a Google. Ver docs/02-Autenticacion.md.
          tags:
            - auth
          responses:
            "302":
              description: Redirección a la pantalla de consentimiento de Google.
      /auth/google/callback:
        get:
          operationId: authGoogleCallback
          summary: Callback de Google tras el consentimiento
          description: Google redirige aquí tras el consentimiento. Verifica state (CSRF)
            y canjea el code por el id_token.
          tags:
            - auth
          parameters:
            - name: code
              in: query
              required: true
              schema:
                type: string
            - name: state
              in: query
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Tokens emitidos (usuario vinculado, existente, o nuevo por
                invitación).
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "400":
              description: El parámetro state no coincide (posible CSRF).
            "401":
              description: code inválido/caducado, o email de Google no verificado.
            "403":
              description: No existe usuario ni invitación válida para ese email
                (REGISTRATION_NOT_ALLOWED).
      /auth/google/id-token:
        post:
          operationId: authGoogleIdToken
          summary: Login con Google a partir de un id_token ya obtenido por el frontend
          description: Mismo camino de verificación que /auth/google/callback, sin
            redirecciones ni PKCE.
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/json:
                example:
                  id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6...
                schema:
                  type: object
                  properties:
                    id_token:
                      type: string
                      minLength: 1
                  required:
                    - id_token
          responses:
            "200":
              description: Tokens emitidos.
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "401":
              description: id_token inválido o email no verificado.
            "403":
              description: No existe usuario ni invitación válida para ese email.
      /invitaciones:
        post:
          operationId: invitationsCreate
          summary: Crea una invitación de un solo uso
          description: Solo un admin puede invitar. El token en claro se devuelve una sola
            vez en la respuesta; después es irrecuperable.
          tags:
            - invitaciones
          x-required-role: admin
          requestBody:
            required: true
            content:
              application/json:
                example:
                  email: pepe@example.com
                  role: user
                schema:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    role:
                      type: string
                      enum:
                        - user
                        - admin
                  required:
                    - email
                    - role
          responses:
            "201":
              description: Invitación creada.
              content:
                application/json:
                  example:
                    id: 019fe8c3-a54e-7b7f-8c8f-e57f0da23eba
                    email: pepe@example.com
                    expiresAt: 2026-08-16T23:02:43.782Z
                    url: http://localhost:5173/registro?token=5rJnTHUDGC2bHp0KgNbp5Z0aeIlJWTTKWZ9wQcGlImQ
                  schema:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      expiresAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      url:
                        type: string
                        format: uri
                    required:
                      - id
                      - email
                      - expiresAt
                      - url
                    additionalProperties: false
            "401":
              description: Sin access token válido.
            "403":
              description: El usuario autenticado no es admin.
            "409":
              description: Ya existe una invitación pendiente para ese email.
      /invitaciones/{token}/validar:
        get:
          operationId: invitationsValidate
          summary: Comprueba si un token de invitación sigue siendo válido
          description: Endpoint público (sin autenticación), pensado para que el frontend
            valide el link antes de mostrar el formulario de registro.
          tags:
            - invitaciones
          parameters:
            - name: token
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Invitación usable.
              content:
                application/json:
                  example:
                    email: pepe@example.com
                    role: user
                    expiresAt: 2026-08-16T23:02:43.782Z
                  schema:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      role:
                        type: string
                        enum:
                          - user
                          - admin
                      expiresAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - email
                      - role
                      - expiresAt
                    additionalProperties: false
            "404":
              description: El token no existe.
            "410":
              description: La invitación ya fue usada, revocada o caducó.
            "429":
              description: Demasiados intentos fallidos (rate limit).
      /temporadas:
        get:
          operationId: temporadasFindAll
          summary: Lista todas las temporadas
          description: Cualquier usuario autenticado puede consultar la lista completa.
          tags:
            - temporadas
          responses:
            "200":
              description: Lista de temporadas.
              content:
                application/json:
                  example:
                    - id: 019ff7eb-22ae-7b8c-a948-6ca9a14625e6
                      codigo: 2026-27
                      nombre: Temporada 2026/27
                      fechaInicio: 2026-08-15
                      fechaFin: 2027-05-30
                      activa: false
                      createdAt: 2026-08-15T10:00:00.000Z
                  schema:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        codigo:
                          type: string
                        nombre:
                          type: string
                        fechaInicio:
                          type: string
                          format: date
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                        fechaFin:
                          type: string
                          format: date
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                        activa:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                        - id
                        - codigo
                        - nombre
                        - fechaInicio
                        - fechaFin
                        - activa
                        - createdAt
                      additionalProperties: false
            "401":
              description: Sin access token válido.
        post:
          operationId: temporadasCreate
          summary: Crea una temporada
          description: Solo un admin puede crear temporadas. El código es inmutable tras
            crearse.
          tags:
            - temporadas
          x-required-role: admin
          requestBody:
            required: true
            content:
              application/json:
                example:
                  codigo: 2026-27
                  nombre: Temporada 2026/27
                  fechaInicio: 2026-08-15
                  fechaFin: 2027-05-30
                schema:
                  type: object
                  properties:
                    codigo:
                      type: string
                      pattern: ^\d{4}-\d{2}$
                    nombre:
                      type: string
                      minLength: 1
                    fechaInicio:
                      type: string
                      format: date
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                    fechaFin:
                      type: string
                      format: date
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                  required:
                    - codigo
                    - nombre
                    - fechaInicio
                    - fechaFin
          responses:
            "201":
              description: Temporada creada.
              content:
                application/json:
                  example:
                    id: 019ff7eb-22ae-7b8c-a948-6ca9a14625e6
                    codigo: 2026-27
                    nombre: Temporada 2026/27
                    fechaInicio: 2026-08-15
                    fechaFin: 2027-05-30
                    activa: false
                    createdAt: 2026-08-15T10:00:00.000Z
                  schema:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      codigo:
                        type: string
                      nombre:
                        type: string
                      fechaInicio:
                        type: string
                        format: date
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                      fechaFin:
                        type: string
                        format: date
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                      activa:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - id
                      - codigo
                      - nombre
                      - fechaInicio
                      - fechaFin
                      - activa
                      - createdAt
                    additionalProperties: false
            "400":
              description: Código con formato inválido, o fechaFin no posterior a fechaInicio.
            "401":
              description: Sin access token válido.
            "403":
              description: El usuario autenticado no es admin.
            "409":
              description: Ya existe una temporada con ese código.
      /temporadas/{codigo}:
        get:
          operationId: temporadasFindByCodigo
          summary: Consulta una temporada por su código
          description: Cualquier usuario autenticado puede consultar una temporada concreta.
          tags:
            - temporadas
          parameters:
            - name: codigo
              in: path
              required: true
              schema:
                type: string
                pattern: ^\d{4}-\d{2}$
              example: 2026-27
          responses:
            "200":
              description: Temporada encontrada.
              content:
                application/json:
                  example:
                    id: 019ff7eb-22ae-7b8c-a948-6ca9a14625e6
                    codigo: 2026-27
                    nombre: Temporada 2026/27
                    fechaInicio: 2026-08-15
                    fechaFin: 2027-05-30
                    activa: false
                    createdAt: 2026-08-15T10:00:00.000Z
                  schema:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      codigo:
                        type: string
                      nombre:
                        type: string
                      fechaInicio:
                        type: string
                        format: date
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                      fechaFin:
