            - name: password
              value: TuPass123456
              disabled: false
        headers:
          - name: Content-Type
            value: application/x-www-form-urlencoded
            disabled: false
        settings: &a1
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
