spec:
  contents:
    openapi: 3.1.0
    info:
      title: quini-api
      version: 1.0.0
      description: API REST autenticada para la gestión de una peña de quiniela.
    servers:
      - url: /api/v1
    tags:
      - name: auth
        description: "Autenticación: login, tokens, Google."
      - name: invitaciones
        description: Alta cerrada por invitación.
      - name: temporadas
        description: Gestión de temporadas.
      - name: equipos
        description: Gestión de equipos.
      - name: jornadas
        description: Jornadas y partidos de una temporada.
      - name: usuarios
        description: Perfil de los miembros de la peña.
      - name: resultados
        description: Resultados oficiales de una jornada.
      - name: apuestas
        description: Apuestas realizadas por los usuarios.
      - name: calculos
        description: Cálculo de aciertos, premios y bote de una jornada.
      - name: pagos
        description: Gestión de pagos de los usuarios.
      - name: dashboard
        description: Agregados de miembros, jornadas y temporadas.
    paths:
      /auth/token:
        post:
          operationId: authToken
          summary: Obtiene tokens (password grant o refresh_token grant)
          description:
            Compatible en forma con el password grant de OAuth2 (RFC 6749). También acepta
            grant_type=refresh_token para rotar el refresh token, con detección de reuso. Ver
            docs/02-Autenticacion.md.
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/x-www-form-urlencoded:
                schema:
                  oneOf:
                    - type: object
                      properties:
                        grant_type:
                          type: string
                          const: password
                        username:
                          type: string
                          minLength: 1
                        password:
                          type: string
                          minLength: 1
                      required:
                        - grant_type
                        - username
                        - password
                    - type: object
                      properties:
                        grant_type:
                          type: string
                          const: refresh_token
                        refresh_token:
                          type: string
                          minLength: 1
                      required:
                        - grant_type
                        - refresh_token
                  type: object
                examples:
                  password:
                    summary: Login con contraseña
                    value:
                      grant_type: password
                      username: admin@quini.local
                      password: TuPass123456
                  refresh:
                    summary: Renovar con refresh_token
                    value:
                      grant_type: refresh_token
                      refresh_token: kUyRts-...
          responses:
            "200":
              description: Tokens emitidos correctamente.
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "400":
              description: Body mal formado o campos faltantes.
            "401":
              description: Credenciales incorrectas o refresh token inválido/reutilizado.
            "429":
              description: Demasiados intentos fallidos (rate limit).
      /auth/revoke:
        post:
          operationId: authRevoke
          summary: Revoca un refresh token concreto
          description:
            Cierra sesión en un solo dispositivo/sesión. Si el token ya no existe o ya estaba
            revocado, no falla (operación idempotente).
          tags:
            - auth
          security:
            - bearerAuth: []
          requestBody:
            required: true
            content:
              application/json:
                example:
                  refresh_token: kUyRts-...
                schema:
                  type: object
                  properties:
                    refresh_token:
                      type: string
                      minLength: 1
                  required:
                    - refresh_token
          responses:
            "204":
              description: Revocado (o ya lo estaba).
            "401":
              description: Sin access token válido.
      /auth/logout:
        post:
          operationId: authLogout
          summary: Revoca todos los refresh tokens del usuario autenticado
          description: Cierra sesión en todos los dispositivos.
          tags:
            - auth
          security:
            - bearerAuth: []
          responses:
            "204":
              description: Todas las sesiones cerradas.
            "401":
              description: Sin access token válido.
      /auth/me:
        get:
          operationId: authMe
          summary: Devuelve la identidad del usuario autenticado
          description:
            Lee el payload del access token ya verificado por requireAuth — no consulta la base de
            datos.
          tags:
            - auth
          security:
            - bearerAuth: []
          responses:
            "200":
              description: Payload del access token.
              content:
                application/json:
                  example:
                    userId: 019fe824-d230-782b-9157-e345641ed2f9
                    email: admin@quini.local
                    role: admin
                  schema:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      role:
                        type: string
                        enum:
                          - user
                          - admin
                    required:
                      - userId
                      - email
                      - role
                    additionalProperties: false
            "401":
              description: Sin access token válido.
      /auth/register:
        post:
          operationId: authRegister
          summary: Completa el registro a partir de una invitación
          description:
            Consume una invitación de un solo uso (por token) y crea el usuario con el rol de la
            invitación, en una transacción. Ver docs/02-Autenticacion.md.
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/json:
                example:
                  token: 5rJnTHUDGC2bHp0KgNbp5Z0aeIlJWTTKWZ9wQcGlImQ
                  password: OtraPass123456
                  nombre: Pepe
                schema:
                  type: object
                  properties:
                    token:
                      type: string
                      minLength: 1
                    password:
                      type: string
                      minLength: 12
                    nombre:
                      type: string
                      minLength: 1
                  required:
                    - token
                    - password
                    - nombre
          responses:
            "201":
              description: Usuario creado y tokens emitidos.
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "404":
              description: El token de invitación no existe.
            "410":
              description: La invitación ya fue usada, revocada o caducó.
            "429":
              description: Demasiados intentos fallidos (rate limit).
      /auth/google:
        get:
          operationId: authGoogleAuthorize
          summary: Inicia el login con Google (Authorization Code + PKCE)
          description: Redirige a Google. Ver docs/02-Autenticacion.md.
          tags:
            - auth
          security:
            - oauth2Google: []
          responses:
            "302":
              description: Redirección a la pantalla de consentimiento de Google.
      /auth/google/callback:
        get:
          operationId: authGoogleCallback
          summary: Callback de Google tras el consentimiento
          description:
            Google redirige aquí tras el consentimiento. Verifica state (CSRF) y canjea el code por
            el id_token.
          tags:
            - auth
          parameters:
            - name: code
              in: query
              required: true
              schema:
                type: string
            - name: state
              in: query
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Tokens emitidos (usuario vinculado, existente, o nuevo por invitación).
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "400":
              description: El parámetro state no coincide (posible CSRF).
            "401":
              description: code inválido/caducado, o email de Google no verificado.
            "403":
              description: No existe usuario ni invitación válida para ese email (REGISTRATION_NOT_ALLOWED).
      /auth/google/id-token:
        post:
          operationId: authGoogleIdToken
          summary: Login con Google a partir de un id_token ya obtenido por el frontend
          description: Mismo camino de verificación que /auth/google/callback, sin redirecciones ni PKCE.
          tags:
            - auth
          requestBody:
            required: true
            content:
              application/json:
                example:
                  id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6...
                schema:
                  type: object
                  properties:
                    id_token:
                      type: string
                      minLength: 1
                  required:
                    - id_token
          responses:
            "200":
              description: Tokens emitidos.
              content:
                application/json:
                  example:
                    access_token: eyJhbGciOiJIUzI1NiJ9...
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: kUyRts-...
                  schema:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        const: Bearer
                      expires_in:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      refresh_token:
                        type: string
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - refresh_token
                    additionalProperties: false
            "401":
              description: id_token inválido o email no verificado.
            "403":
              description: No existe usuario ni invitación válida para ese email.
      /invitaciones:
        post:
          operationId: invitationsCreate
          summary: Crea una invitación de un solo uso
          description: Solo un admin puede invitar. El token en claro se devuelve una sola vez en la
            respuesta; después es irrecuperable.
