            required: true
            content:
              application/json:
                example:
                  email: pepe@example.com
                  role: user
                schema:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    role:
                      type: string
