                      - premiosTotales
                      - mediaAciertosDosApuestas
                      - mediaAciertosMaximos
                      - clasificacion
                    additionalProperties: false
            "400":
              description: "'jornada' no es un entero positivo."
            "401":
              description: Sin access token válido.
            "404":
              description: Jornada o temporada inexistentes, o la jornada aún no tiene cálculo ejecutado.
      /dashboard/temporada:
        get:
          operationId: dashboardTemporada
          summary: Agregados de una temporada completa
          description:
            Máximos y mínimos de aciertos con quiénes los lograron (pueden ser varios), y los
            totales de premios, pagos y bote.
          tags:
            - dashboard
          security:
            - bearerAuth: []
          parameters:
            - name: temporada
              in: query
              required: false
              schema:
                type: string
                pattern: ^\d{4}-\d{2}$
              example: 2026-27
          responses:
            "200":
              description: Agregados de la temporada.
              content:
                application/json:
                  example:
                    temporada: 2026-27
                    maxAciertos: 10
                    usuariosMaxAciertos:
                      - 019ff7eb-22ae-7b8c-a948-6ca9a14625e6
                    minAciertos: 4
                    usuariosMinAciertos:
                      - 019ff7eb-9999-7b8c-a948-6ca9a14625e6
                    premiosTotales: 10.49
                    pagosTotales: 22
                    boteTotal: 17.49
                    jornadasCalculadas: 1
                  schema:
                    type: object
                    properties:
                      temporada:
                        type: string
                      maxAciertos:
                        anyOf:
                          - type: integer
                            minimum: 0
                            maximum: 14
                          - type: "null"
                      usuariosMaxAciertos:
                        type: array
                        items:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      minAciertos:
                        anyOf:
                          - type: integer
                            minimum: 0
                            maximum: 14
                          - type: "null"
                      usuariosMinAciertos:
                        type: array
                        items:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      premiosTotales:
                        type: number
                        minimum: 0
                      pagosTotales:
                        type: number
                        minimum: 0
                      boteTotal:
                        type: number
                        minimum: 0
                      jornadasCalculadas:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                      - temporada
                      - maxAciertos
                      - usuariosMaxAciertos
                      - minAciertos
                      - usuariosMinAciertos
                      - premiosTotales
                      - pagosTotales
                      - boteTotal
                      - jornadasCalculadas
                    additionalProperties: false
            "401":
              description: Sin access token válido.
            "404":
              description: No existe esa temporada, o no hay temporada activa y no se especificó ninguna.
    components:
